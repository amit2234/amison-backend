<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Galaxy Star (720x1030)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas" width="720" height="1030"></canvas>

    <!-- DEDICATED GALAXY VAULT AUTH & ROUND SYNC LOADING OVERLAY -->
    <div id="gameLoadingOverlay" class="game-loading-overlay">
      <div class="loading-content">
        <div class="planet-spinner">
          <div class="orbit-ring"></div>
          <div class="orbit-planet"></div>
          <div class="center-star">⭐</div>
        </div>
        <div class="loading-title">GALAXY STAR</div>
        <div id="loadingStatusText" class="loading-status">Connecting to Secure Game Vault...</div>
        <div class="loading-bar-container">
          <div id="loadingProgressBar" class="loading-bar-fill"></div>
        </div>
      </div>
    </div>

    <!-- WINNER POPUP OVERLAY -->
    <div id="winnerPopup" class="winner-popup hidden">
      <div class="winner-popup-header">
        <div class="winner-price-box">
          <span class="label">Price:</span>
          <span id="winnerPriceVal" class="val">0</span>
        </div>
        <div class="winner-wager-box">
          <span class="label">Your wager:</span>
          <span id="winnerWagerVal" class="val">0</span>
        </div>
      </div>
      <div class="winner-podium">
        <!-- 2nd place / Left -->
        <div class="podium-col left">
          <div class="podium-avatar-box">
            <img id="winnerAvatar2" src="" alt="2nd" class="podium-avatar" />
            <div id="winnerPlaceholder2" class="podium-placeholder">👤</div>
          </div>
          <div id="winnerName2" class="podium-name">Empty</div>
          <div id="winnerAmt2" class="podium-amt">—</div>
        </div>
        <!-- 1st place / Center -->
        <div class="podium-col center">
          <div id="winnerCenterRing" class="podium-avatar-box center-ring">
            <img id="winnerAvatar1" src="" alt="1st" class="podium-avatar" />
            <div id="winnerPlaceholder1" class="podium-placeholder">👑</div>
          </div>
          <div id="winnerName1" class="podium-name center-name">Empty</div>
          <div id="winnerAmt1" class="podium-amt center-amt">—</div>
        </div>
        <!-- 3rd place / Right -->
        <div class="podium-col right">
          <div class="podium-avatar-box">
            <img id="winnerAvatar3" src="" alt="3rd" class="podium-avatar" />
            <div id="winnerPlaceholder3" class="podium-placeholder">👤</div>
          </div>
          <div id="winnerName3" class="podium-name">Empty</div>
          <div id="winnerAmt3" class="podium-amt">—</div>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
